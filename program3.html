<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA26 Project Calendar</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #37352f;
      --border: #e9e9e7;
      --header-bg: #f7f6f3;
      --hover-bg: #f1f0ec;
      
      /* Member Colors */
      --hugo-color: #2563eb;
      --fan-color: #059669;
      --federico-color: #7c3aed;
      --lara-color: #d97706;
      --alessandro-color: #db2777;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); }
    .container { max-width: 1100px; margin: 0 auto; }

    h2 { margin: 0 0 12px 0; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }

    /* Controls Panel */
    .panel { background: var(--header-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .panel-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
    .panel-row:last-child { margin-bottom: 0; }
    
    label { font-size: 0.8rem; font-weight: 600; }
    select, input, button { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.8rem; }
    button { background: #37352f; color: white; border: none; cursor: pointer; transition: opacity 0.2s; font-weight: 600; }
    button:hover { opacity: 0.85; }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 0.75rem; }
    .legend-item { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; background: var(--header-bg); border: 1px solid var(--border); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* Calendar Grid Header & Days */
    .month-nav { display: flex; align-items: center; gap: 12px; }
    .month-nav button { padding: 4px 8px; background: #fff; color: var(--text); border: 1px solid var(--border); }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .day-header { background: var(--header-bg); padding: 8px; text-align: center; font-weight: 600; font-size: 0.8rem; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .day-cell { min-height: 110px; background: #fff; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; display: flex; flex-direction: column; gap: 3px; font-size: 0.75rem; }
    .day-cell.other-month { background: #fafafa; opacity: 0.4; }
    .day-number { font-weight: 600; margin-bottom: 4px; padding: 2px 4px; width: fit-content; border-radius: 3px; }
    .day-number.today { background: #37352f; color: white; }

    /* Item Cards Styling (Shapes, Borders & Colors) */
    .event-card { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; line-height: 1.2; word-break: break-word; }
    .event-card .delete-btn { opacity: 0.3; font-weight: bold; margin-left: 4px; }
    .event-card:hover .delete-btn { opacity: 1; }

    /* 1. Member Availability Shapes */
    .type-avail { color: white; font-weight: 500; border-radius: 12px; padding: 2px 8px; }
    .type-avail.status-Available { border-left: 4px solid #10B981; }
    .type-avail.status-Maybe { border: 1px dashed rgba(0,0,0,0.4); opacity: 0.9; }
    .type-avail.status-Busy { text-decoration: line-through; opacity: 0.65; border-radius: 2px; }

    /* 2. Key Deadline: Sharp Diamond Badge / Crimson Accent */
    .type-deadline { background: #fef2f2; border: 2px solid #ef4444; color: #991b1b; font-weight: 700; border-radius: 0px 8px 0px 8px; padding: 4px; }
    .type-deadline::before { content: "♦ "; color: #dc2626; }

    /* 3. Meeting: Indigo Rounded Pill with Left Accent Line */
    .type-meeting { background: #e0e7ff; border-left: 4px solid #4f46e5; color: #3730a3; font-weight: 600; border-radius: 10px; }

    /* 4. Special Event / Excursion: Teal Badge with Left Border Accent */
    .type-event { background: #ccfbf1; border: 1px solid #0d9488; border-left: 4px solid #0f766e; color: #115e59; font-weight: 600; border-radius: 6px; }

    /* 5. Note: Sticky Note Style (Warm Yellow Card) */
    .type-note { background: #fef3c7; border: 1px solid #f59e0b; color: #78350f; border-radius: 2px; box-shadow: 1px 1px 2px rgba(0,0,0,0.05); }

  </style>
</head>
<body>

<div class="container">
  <h2>
    <span>IPA26 Project Calendar</span>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀</button>
      <span id="monthYearLabel" style="font-size: 1rem;"></span>
      <button onclick="changeMonth(1)">▶</button>
    </div>
  </h2>

  <!-- Visual Legend -->
  <div class="legend">
    <strong style="margin-right: 4px;">Members:</strong>
    <span class="legend-item"><span class="dot" style="background:var(--hugo-color)"></span>Hugo</span>
    <span class="legend-item"><span class="dot" style="background:var(--fan-color)"></span>Fan</span>
    <span class="legend-item"><span class="dot" style="background:var(--federico-color)"></span>Federico</span>
    <span class="legend-item"><span class="dot" style="background:var(--lara-color)"></span>Lara</span>
    <span class="legend-item"><span class="dot" style="background:var(--alessandro-color)"></span>Alessandro</span>
    
    <strong style="margin-left: 12px; margin-right: 4px;">Styles:</strong>
    <span class="legend-item" style="border-left: 3px solid #10B981;">Available</span>
    <span class="legend-item" style="border: 1px dashed #666;">Maybe</span>
    <span class="legend-item" style="text-decoration: line-through;">Busy</span>
    <span class="legend-item" style="background:#fef2f2; border:1px solid #ef4444; color:#991b1b;">♦ Deadline</span>
    <span class="legend-item" style="background:#e0e7ff; border-left:3px solid #4f46e5;">👥 Meeting</span>
    <span class="legend-item" style="background:#ccfbf1; border-left:3px solid #0f766e; color:#115e59;">📍 Excursion/Event</span>
    <span class="legend-item" style="background:#fef3c7; border:1px solid #f59e0b;">📝 Note</span>
  </div>

  <!-- Add Item Form Panel -->
  <div class="panel">
    <div class="panel-row">
      <div>
        <label>Category:</label>
        <select id="itemType" onchange="toggleFormFields()">
          <option value="avail">Member Availability</option>
          <option value="deadline">Key Deadline</option>
          <option value="meeting">Team Meeting</option>
          <option value="event">Excursion / Supervisor Event</option>
          <option value="note">Note</option>
        </select>
      </div>

      <div>
        <label>Date:</label>
        <input type="date" id="itemDate">
      </div>

      <!-- Conditional Availability Fields -->
      <div id="memberGroup">
        <label>Member:</label>
        <select id="itemMember">
          <option value="Hugo">Hugo</option>
          <option value="Fan">Fan</option>
          <option value="Federico">Federico</option>
          <option value="Lara">Lara</option>
          <option value="Alessandro">Alessandro</option>
        </select>
      </div>

      <div id="statusGroup">
        <label>Status:</label>
        <select id="itemStatus">
          <option value="Available">Available</option>
          <option value="Maybe">Maybe</option>
          <option value="Busy">Busy</option>
        </select>
      </div>

      <!-- Conditional Title / Details Fields -->
      <div id="titleGroup" style="display:none; flex-grow:1;">
        <label id="titleLabel">Title:</label>
        <input type="text" id="itemTitle" placeholder="e.g., Winterthur Site Visit" style="width: 100%;">
      </div>

      <div id="timeGroup">
        <label>Time / Slot:</label>
        <input type="text" id="itemTime" placeholder="e.g. 14:00 - 16:00" style="width: 110px;">
      </div>

      <button onclick="addItem()" style="margin-top: 16px;">+ Add Entry</button>
    </div>
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid">
    <div class="day-header">Mon</div>
    <div class="day-header">Tue</div>
    <div class="day-header">Wed</div>
    <div class="day-header">Thu</div>
    <div class="day-header">Fri</div>
    <div class="day-header">Sat</div>
    <div class="day-header">Sun</div>
    <div id="calendarDays" style="display: contents;"></div>
  </div>
</div>

<script>
  const memberColors = {
    "Hugo": "var(--hugo-color)",
    "Fan": "var(--fan-color)",
    "Federico": "var(--federico-color)",
    "Lara": "var(--lara-color)",
    "Alessandro": "var(--alessandro-color)"
  };

  let currentDate = new Date();
  let calendarData = JSON.parse(localStorage.getItem('ipa26_calendar_events')) || [];

  function init() {
    document.getElementById('itemDate').valueAsDate = new Date();
    toggleFormFields();
    renderCalendar();
  }

  function toggleFormFields() {
    const type = document.getElementById('itemType').value;
    const memberGroup = document.getElementById('memberGroup');
    const statusGroup = document.getElementById('statusGroup');
    const titleGroup = document.getElementById('titleGroup');
    const titleLabel = document.getElementById('titleLabel');

    if (type === 'avail') {
      memberGroup.style.display = 'block';
      statusGroup.style.display = 'block';
      titleGroup.style.display = 'none';
    } else {
      memberGroup.style.display = 'none';
      statusGroup.style.display = 'none';
      titleGroup.style.display = 'block';
      
      if (type === 'deadline') titleLabel.textContent = 'Deadline Title:';
      else if (type === 'meeting') titleLabel.textContent = 'Meeting Topic:';
      else if (type === 'event') titleLabel.textContent = 'Event / Excursion Title:';
      else titleLabel.textContent = 'Note Content:';
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYearLabel').textContent = 
      new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    const grid = document.getElementById('calendarDays');
    grid.innerHTML = '';

    const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Monday start
    const totalDays = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const todayStr = new Date().toISOString().split('T')[0];

    // Previous month padding
    for (let i = firstDayIndex; i > 0; i--) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day-cell other-month';
      dayDiv.innerHTML = `<span class="day-number">${prevMonthDays - i + 1}</span>`;
      grid.appendChild(dayDiv);
    }

    // Current month days
    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day-cell';

      const isToday = dateStr === todayStr;
      dayDiv.innerHTML = `<span class="day-number ${isToday ? 'today' : ''}">${day}</span>`;

      // Filter events for this day
      const dayEvents = calendarData.filter(e => e.date === dateStr);
      dayEvents.forEach(evt => {
        const card = document.createElement('div');
        
        if (evt.type === 'avail') {
          card.className = `event-card type-avail status-${evt.status}`;
          card.style.backgroundColor = memberColors[evt.member] || '#333';
          const timeText = evt.time ? ` (${evt.time})` : '';
          const icon = evt.status === 'Available' ? '✓' : evt.status === 'Maybe' ? '?' : '✖';
          card.innerHTML = `<span>${icon} ${evt.member}${timeText}</span><span class="delete-btn" onclick="deleteItem(${evt.id}, event)">×</span>`;
        } 
        else if (evt.type === 'deadline') {
          card.className = 'event-card type-deadline';
          const timeText = evt.time ? ` [${evt.time}]` : '';
          card.innerHTML = `<span>${evt.title}${timeText}</span><span class="delete-btn" onclick="deleteItem(${evt.id}, event)">×</span>`;
        } 
        else if (evt.type === 'meeting') {
          card.className = 'event-card type-meeting';
          const timeText = evt.time ? ` @ ${evt.time}` : '';
          card.innerHTML = `<span>👥 ${evt.title}${timeText}</span><span class="delete-btn" onclick="deleteItem(${evt.id}, event)">×</span>`;
        }
        else if (evt.type === 'event') {
          card.className = 'event-card type-event';
          const timeText = evt.time ? ` @ ${evt.time}` : '';
          card.innerHTML = `<span>📍 ${evt.title}${timeText}</span><span class="delete-btn" onclick="deleteItem(${evt.id}, event)">×</span>`;
        }
        else if (evt.type === 'note') {
          card.className = 'event-card type-note';
          card.innerHTML = `<span>📝 ${evt.title}</span><span class="delete-btn" onclick="deleteItem(${evt.id}, event)">×</span>`;
        }

        dayDiv.appendChild(card);
      });

      grid.appendChild(dayDiv);
    }
  }

  function addItem() {
    const type = document.getElementById('itemType').value;
    const date = document.getElementById('itemDate').value;
    const time = document.getElementById('itemTime').value.trim();

    if (!date) {
      alert("Please select a date.");
      return;
    }

    const newItem = { id: Date.now(), type, date, time };

    if (type === 'avail') {
      newItem.member = document.getElementById('itemMember').value;
      newItem.status = document.getElementById('itemStatus').value;
    } else {
      const title = document.getElementById('itemTitle').value.trim();
      if (!title) {
        alert("Please enter a title or note description.");
        return;
      }
      newItem.title = title;
    }

    calendarData.push(newItem);
    saveAndRefresh();
    
    // Clear title input
    document.getElementById('itemTitle').value = '';
    document.getElementById('itemTime').value = '';
  }

  function deleteItem(id, event) {
    event.stopPropagation();
    calendarData = calendarData.filter(item => item.id !== id);
    saveAndRefresh();
  }

  function saveAndRefresh() {
    localStorage.setItem('ipa26_calendar_events', JSON.stringify(calendarData));
    renderCalendar();
  }

  init();
</script>

</body>
</html>
